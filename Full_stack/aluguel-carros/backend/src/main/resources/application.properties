spring.application.name=aluguel-carros
server.port=${PORT:8080}

# Origens do front-end (Vite) liberadas no CORS, separadas por vírgula
app.cors.allowed-origin=${APP_CORS_ALLOWED_ORIGIN:http://localhost:5173}

# ------------------------------------------------------------------
# Banco de dados: Supabase (PostgreSQL)
#
# NUNCA coloque usuário/senha reais neste arquivo (ele vai para o GitHub).
# Coloque em src/main/resources/application-local.properties (ignorado pelo git),
# usando application-local.properties.example como modelo,
# ou defina as variáveis de ambiente SUPABASE_DB_URL / SUPABASE_DB_USER / SUPABASE_DB_PASSWORD.
# ------------------------------------------------------------------
spring.config.import=optional:classpath:application-local.properties

# Os valores abaixo vêm de variáveis de ambiente; se não existirem, caem no
# application-local.properties (carregado acima). Assim nenhum segredo fica neste arquivo.
spring.datasource.url=${SUPABASE_DB_URL:}
spring.datasource.username=${SUPABASE_DB_USER:}
spring.datasource.password=${SUPABASE_DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
